<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery | Menu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/bakery-logo_c.jpg" alt="North Star Bakery Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html" class="active">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Pre-Order</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Our Daily Menu</h1>
        <div class="product-grid">
            <div class="card">
                <img src="images/bakery-feature-large_c.jpg" alt="Assortment of cookies and baked goods">
                <h3>Artisan Cookies</h3>
                <p>Rich chocolate chip and specialty seasonal cookies.</p>
                <button class="btn favorite-btn" data-item="cookies">Save as Favorite</button>
            </div>
            <div class="card">
                <img src="images/bakery-feature-small_c.jpg" alt="Detailed view of fresh pastries">
                <h3>Morning Bakes</h3>
                <p>Freshly baked selections rotating daily.</p>
                <button class="btn favorite-btn" data-item="pastries">Save as Favorite</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 North Star Bakery. All rights reserved.</p>
    </footer>

    <script src="js/script.js" defer></script>
</body>
</html>
